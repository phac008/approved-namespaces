apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: update-yaml-file
  title: Update a yaml file
  description: Opens a PR with updates to a yaml file.

spec:
  owner: engineering
  type: example
  parameters:
    - title: Provide Team Name
      required: ['content']
      properties:
        content:
          title: Team Name
          type: string
          description: Add Configuration for Team Onboarding

  steps:
    - id: fetchPlain
      name: Fetch the actual team configuration File
      action: fetch:plain
      input:
      #  url: https://github.com/suxess-it/sx-cnp-oss/blob/uibklab/platform-apps/charts/team-onboarding/'
      #  url: https://github.com/phac008/approved-namespaces'
        url: ./
    - id: update
      name: Update
      action: roadiehq:utils:fs:append
      input:
        # This file must exist at this path in the repo referenced above
        path: README.md
        content: ${{ parameters.content }}

    - id: publish
      name: Publish
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=approved-namespaces&owner=phac008
        title: Update demo
        description: update description
        targetPath: .
        branchName: update-team-template # TODO parameterise?